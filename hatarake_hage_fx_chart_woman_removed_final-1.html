<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>働け！ハゲ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:100vw;height:100vh;max-width:1100px;max-height:720px;overflow:hidden;background:#8fd7ff}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;z-index:5;left:10px;right:10px;top:max(9px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.badge{background:rgba(0,0,0,.70);color:#fff;border-radius:13px;padding:7px 11px;font-weight:900;font-size:clamp(13px,3.7vw,20px);text-shadow:0 1px 2px #000}
#controls{position:absolute;z-index:10;left:12px;right:12px;bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.ctrl{pointer-events:auto;border:3px solid #fff;color:#fff;font-weight:1000;border-radius:50%;width:clamp(82px,21vw,125px);height:clamp(82px,21vw,125px);font-size:clamp(15px,4.5vw,24px);box-shadow:0 6px 0 rgba(0,0,0,.35);touch-action:none}
#jump{background:rgba(255,126,45,.92)}
#attack{background:#fff;color:#d40000;border:4px solid #d40000;border-radius:12px;width:clamp(110px,27vw,150px);height:clamp(64px,15vw,82px);font-size:clamp(20px,5.2vw,30px);box-shadow:0 5px 0 rgba(120,0,0,.28);text-shadow:none}
.loss-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(120,0,0,.28)}
.ctrl:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#center{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center}
.panel{background:rgba(0,0,0,.80);color:#fff;border:3px solid rgba(255,255,255,.85);border-radius:22px;padding:22px;max-width:min(90vw,520px);box-shadow:0 16px 45px rgba(0,0,0,.35)}
h1{font-size:clamp(28px,8vw,48px);margin:0 0 8px} p{font-size:clamp(14px,4vw,18px);line-height:1.5;margin:8px 0 15px}
.start{border:0;border-radius:14px;padding:13px 24px;background:#ffd33d;color:#382900;font-size:20px;font-weight:1000}
.small{opacity:.82;font-size:13px}

const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");

let W=0,H=0,dpr=1,state="ready",score=0,lossCutScore=0,distance=0,last=0,speed=0,spawnX=0,enemyTimer=0;

function resize(){
 const r=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
 W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 player.w=Math.min(105,W*.22);player.h=player.w;
 if(state==="ready")player.y=terrainY(player.x+player.w*.5)-player.h*.88;
}
addEventListener("resize",resize);
function groundY(){return H*.78}
function chartY(worldX){
 // FXチャートの価格ラインそのものを走行面にする
 const y=H*.69 + Math.sin(worldX/155)*H*.060 + Math.sin(worldX/390+1.3)*H*.075 + Math.sin(worldX/820)*H*.040;
 return Math.max(H*.54,Math.min(H*.78,y));
}
function terrainY(screenX){
 const world=screenX+distance;
 return chartY(world);
}
function reset(){
 score=0;lossCutScore=0;distance=0;speed=Math.max(280,W*.48);pits=[];items=[];enemies=[];shots=[];enemyTimer=1.2;spawnX=W*.8;
 player.x=W*.16;player.y=terrainY(player.x+player.w*.5)-player.h*.88;player.vy=0;player.onGround=true;player.jumps=0;player.flight=0;player.attackCd=0;player.attackAnim=0;player.scatterBubble=0;
 for(let i=0;i<6;i++)clouds.push({x:i*W*.25+80,y:50+Math.random()*H*.22,s:.7+Math.random()*.7});
 for(let i=0;i<4;i++)addSet(W+i*W*.5);
 scoreEl.textContent="0";debtEl.textContent="0";
}
function addSet(x){
 const pitW=55+Math.random()*45,pitX=x+120+Math.random()*90;
 pits.push({x:pitX,w:pitW});
 const ix=x+255+Math.random()*115;items.push({type:"yarn",x:ix,y:0,w:52,h:52,got:false,bob:Math.random()*6});
 if(Math.random()<.62){const wx=x+410+Math.random()*120;items.push({type:"wing",x:wx,y:0,w:58,h:58,got:false,bob:Math.random()*6});}
}
let audioCtx=null;
function ensureAudio(){
 if(!audioCtx){
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return null;
   audioCtx=new AC();
 }
 if(audioCtx.state==='suspended') audioCtx.resume();
 return audioCtx;
}
function tone(freq1,freq2,duration,type='sine',volume=.055,delay=0){
 const ac=ensureAudio(); if(!ac)return;
 const t=ac.currentTime+delay;
 const o=ac.createOscillator(), g=ac.createGain();
 o.type=type; o.frequency.setValueAtTime(freq1,t);
 o.frequency.exponentialRampToValueAtTime(Math.max(40,freq2),t+duration);
 g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(volume,t+.012);
 g.gain.exponentialRampToValueAtTime(.0001,t+duration);
 o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration+.02);
}
function jumpSound(){
 // 軽く上昇する「ピョン！」
 tone(330,720,.16,'triangle',.065);
 tone(520,980,.11,'sine',.035,.055);
}
function scatterSound(){
 // コインをばらまくような「チャララッ」
 tone(880,1320,.10,'square',.045);
 tone(1040,1560,.10,'square',.040,.07);
 tone(1240,1760,.12,'triangle',.032,.14);
}
function wingItemSound(){
 // 飛行アイテム取得：キラッと上昇する音
 tone(520,1040,.18,'sine',.065);
 tone(780,1560,.20,'triangle',.045,.08);
 tone(1040,2080,.24,'sine',.035,.16);
}
function pointItemSound(){
 // 支持率アイテム取得：明るいポイント獲得音
 tone(660,880,.11,'triangle',.060);

 tone(1320,1760,.16,'sine',.040,.18);
}

function gameOverSound(){
 // ゲームオーバー：下降する短いジングル
 tone(440,220,.24,'sawtooth',.055);
 tone(330,165,.30,'triangle',.045,.20);
 tone(220,90,.38,'sine',.040,.42);
}

function jump(){
 if(state!=="playing")return;
 // 飛行中にJUMPを押すと飛行を即時解除して通常状態へ戻る
 if(player.flight>0){player.flight=0;player.vy=0;player.onGround=false;player.jumps=0;return;}
 if(player.onGround){player.vy=-Math.min(780,H*1.18);player.onGround=false;player.jumps=1;jumpSound();}
 else if(player.jumps<2){player.vy=-Math.min(720,H*1.08);player.jumps=2;jumpSound();}
}
function attack(){
 if(state!=="playing"||player.attackCd>0)return;
 player.attackCd=.28;player.attackAnim=.34;player.scatterBubble=.75;scatterSound();lossCutScore-=5;debtEl.textContent=lossCutScore;
 shots.push({x:player.x+player.w*.82,y:player.y+player.h*.43,w:46,h:40,vx:Math.max(650,W*1.25),life:2});
}
jumpBtn.addEventListener("pointerdown",e=>{e.preventDefault();jump()});
attackBtn.addEventListener("pointerdown",e=>{e.preventDefault();attack()});
canvas.addEventListener("pointerdown",e=>{if(state==="playing")jump()});
document.getElementById("start").onclick=()=>startGame();
function startGame(){ensureAudio();reset();state="playing";center.style.display="none";startFace.style.display="none";last=performance.now();requestAnimationFrame(loop)}
function drawBackground(dt){
 ctx.clearRect(0,0,W,H);
 // ドル円チャート風の背景
 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,"#f8fbff");grad.addColorStop(.72,"#e9f1f7");grad.addColorStop(1,"#c8d6df");
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 // チャートのグリッド
 ctx.strokeStyle="rgba(45,91,120,.18)";ctx.lineWidth=1;
 const gx=70, gy=Math.max(46,H*.085);
 for(let x=(-distance*.35)%gx;x<W;x+=gx){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
 for(let y=gy;y<H*.78;y+=gy){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

 // 価格目盛り
 ctx.font="700 12px sans-serif";ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillStyle="rgba(30,65,90,.68)";
 const basePrice=158.20+Math.sin(distance/700)*.35;
 for(let i=0;i<6;i++){const y=34+i*(H*.72/5);ctx.fillText((basePrice-i*.25).toFixed(2),W-8,y);}

 // ローソク足
 const cw=18, gap=16, step=cw+gap, shift=(distance*.75)%step;
 for(let i=-2;i<W/step+3;i++){
   const x=i*step-shift;
   const wave=Math.sin((i*0.73)+(distance/180));
   const open=H*.34 + Math.sin(i*.61+distance/430)*H*.11;
   const bodyH=18+Math.abs(Math.sin(i*1.17+distance/250))*36;
   const close=open+(wave>0?bodyH:-bodyH);
   const high=Math.min(open,close)-18-Math.abs(Math.sin(i*1.9))*22;
   const low=Math.max(open,close)+18+Math.abs(Math.cos(i*1.3))*20;
   ctx.strokeStyle=close>=open?"rgba(20,130,90,.78)":"rgba(210,55,65,.78)";
   ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+cw/2,high);ctx.lineTo(x+cw/2,low);ctx.stroke();
   ctx.fillStyle=close>=open?"rgba(32,165,115,.78)":"rgba(218,70,78,.78)";
   ctx.fillRect(x,Math.min(open,close),cw,Math.max(4,Math.abs(close-open)));
 }

 // 価格ライン（ドル円チャートらしい動き）
 ctx.beginPath();
 for(let x=0;x<=W+4;x+=4){
   const wx=x+distance;
   const y=chartY(wx);
   if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.strokeStyle="#cc2f3f";ctx.lineWidth=4;ctx.shadowColor="rgba(204,47,63,.25)";ctx.shadowBlur=5;ctx.stroke();ctx.shadowBlur=0;

 // 移動平均線
 ctx.beginPath();
 for(let x=0;x<=W+4;x+=5){
   const wx=x+distance;
   const y=H*.61 + Math.sin(wx/290+0.7)*H*.045 + Math.sin(wx/690)*H*.028;
   if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.strokeStyle="#2d73c7";ctx.lineWidth=3;ctx.stroke();

 // チャート上部のラベル
 ctx.fillStyle="rgba(18,43,63,.86)";ctx.fillRect(0,0,W,38);
 ctx.fillStyle="#fff";ctx.font="900 16px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
 ctx.fillText("USD/JPY  ドル円",12,19);
 ctx.fillStyle="#ffcf40";ctx.font="900 14px sans-serif";ctx.textAlign="right";
 ctx.fillText("USDJPY  ¥158.20",W-12,19);

 // FXチャート上をそのまま走るための価格ラインを強調
 // 白いラインは連続表示し、赤い足場ラインだけ落とし穴の区間を描かない
 ctx.save();
 ctx.lineJoin="round";ctx.lineCap="round";
 ctx.beginPath();
 for(let x=0;x<=W+4;x+=3){
   const y=chartY(x+distance);
   if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.strokeStyle="rgba(255,255,255,.95)";ctx.lineWidth=11;ctx.stroke();

   // 落とし穴の上だけ赤線を途切れさせる
   ctx.beginPath();
   let drawing=false;
   for(let x=0;x<=W+4;x+=3){
     const inPit=pits.some(p=>x>p.x-3 && x<p.x+p.w+3);
     const y=chartY(x+distance);
     if(inPit){
       drawing=false;
       continue;
     }
     if(!drawing){ctx.moveTo(x,y);drawing=true;}
     else ctx.lineTo(x,y);
   }
   ctx.strokeStyle="#e21f2f";ctx.lineWidth=6;ctx.stroke();
 ctx.restore();
 // チャート下部の価格エリア
 const ground=H*.82;
 ctx.fillStyle="rgba(24,43,56,.86)";ctx.fillRect(0,ground,W,H-ground);
 ctx.strokeStyle="rgba(255,255,255,.16)";ctx.lineWidth=2;
 for(let y=ground+28;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
 ctx.fillStyle="rgba(255,255,255,.85)";ctx.font="900 13px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
 ctx.fillText("FX MARKET  /  USDJPY",12,ground);
}
function drawPit(p){
 const y1=terrainY(p.x),y2=terrainY(p.x+p.w);ctx.fillStyle="#242424";ctx.beginPath();ctx.moveTo(p.x,y1);ctx.lineTo(p.x+p.w,y2);ctx.lineTo(p.x+p.w-14,y2+H*.22);ctx.lineTo(p.x+14,y1+H*.22);ctx.closePath();ctx.fill();
 ctx.fillStyle="#111";ctx.beginPath();ctx.moveTo(p.x+10,y1+7);ctx.lineTo(p.x+p.w-10,y2+7);ctx.lineTo(p.x+p.w-10,y2+12);ctx.lineTo(p.x+10,y1+12);ctx.closePath();ctx.fill();
}
function drawItem(it,t){
 const bob=Math.sin(t/180+it.bob)*5;
 if(it.type==="yarn"){
   it.y=terrainY(it.x)-72;
   const yy=it.y+bob;
   ctx.save();ctx.translate(it.x,yy);ctx.shadowColor="rgba(255,220,60,.95)";ctx.shadowBlur=18;
   const ar=yarn.naturalWidth/yarn.naturalHeight||1;let dw=Math.min(92,it.w*1.55),dh=dw/ar;
   if(dh>72){dh=72;dw=dh*ar;}ctx.drawImage(yarn,-dw/2,-dh/2,dw,dh);ctx.restore();
   ctx.save();ctx.font="900 14px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#ffe600";ctx.strokeStyle="#222";ctx.lineWidth=3;
   ctx.strokeText("+10点",it.x,it.y-dh/2-12+bob);ctx.fillText("+10点",it.x,it.y-dh/2-12+bob);ctx.restore();
 } else {
   it.y=terrainY(it.x)-105; const yy=it.y+bob;
   ctx.save();ctx.translate(it.x,yy);ctx.shadowColor="rgba(255,255,255,.95)";ctx.shadowBlur=22;
   const ar=wingImg.naturalWidth/wingImg.naturalHeight||1;let dw=it.w*1.45,dh=dw/ar;
   if(dh>90){dh=90;dw=dh*ar;}ctx.drawImage(wingImg,-dw/2,-dh/2,dw,dh);ctx.restore();
   ctx.fillStyle="#fff";ctx.font="900 13px sans-serif";ctx.textAlign="center";ctx.strokeStyle="#222";ctx.lineWidth=3;
   ctx.strokeText("飛行 3秒",it.x,it.y-dh/2-9+bob);ctx.fillText("飛行 3秒",it.x,it.y-dh/2-9+bob);
 }
}

function drawPlayer(){
 const t=performance.now();
 let row=0;
 if(player.attackAnim>0) row=3;
 else if(player.flight>0) row=2;
 else if(!player.onGround) row=1;
 else row=0;
 const frameCount=4;
 const sw=spriteSheet.naturalWidth/frameCount, sh=spriteSheet.naturalHeight/4;
 const frame=Math.floor(t/110)%frameCount;
 const sx=frame*sw, sy=row*sh;
 ctx.save();
 ctx.translate(player.x,player.y);
 if(player.flight>0){ctx.globalAlpha=.9;ctx.shadowColor="#fff";ctx.shadowBlur=20;}
 if(spriteSheet.complete && spriteSheet.naturalWidth){
   ctx.drawImage(spriteSheet,sx,sy,sw,sh,0,0,player.w,player.h);
 }
 ctx.restore();
 if(player.flight>0){
   const bx=player.x+player.w*.55, by=player.y-48;
   ctx.save();ctx.font="900 17px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
   const text="",pad=10,tw=ctx.measureText(text).width;
   ctx.fillStyle="white";ctx.strokeStyle="#222";ctx.lineWidth=3;
   ctx.beginPath();ctx.roundRect(bx-tw/2-pad,by-17,tw+pad*2,34,12);ctx.fill();ctx.stroke();
   ctx.beginPath();ctx.moveTo(bx-12,by+17);ctx.lineTo(bx-22,by+32);ctx.lineTo(bx+2,by+17);ctx.closePath();ctx.fill();ctx.stroke();
   ctx.fillStyle="#222";ctx.fillText(text,bx,by+1);ctx.restore();
 }
 if(player.scatterBubble>0){
   const bx=player.x+player.w*.58, by=player.y-46;
   ctx.save();ctx.font="900 17px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
   const text="損切り！",pad=10,tw=ctx.measureText(text).width;
   ctx.fillStyle="white";ctx.strokeStyle="#222";ctx.lineWidth=3;
   ctx.beginPath();ctx.roundRect(bx-tw/2-pad,by-17,tw+pad*2,34,12);ctx.fill();ctx.stroke();
   ctx.beginPath();ctx.moveTo(bx-12,by+17);ctx.lineTo(bx-22,by+32);ctx.lineTo(bx+2,by+17);ctx.closePath();ctx.fill();ctx.stroke();
   ctx.fillStyle="#d40000";ctx.fillText(text,bx,by+1);ctx.restore();
 }
}
function drawShot(s){
 ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.sin(s.x/25)*.08);
 ctx.shadowColor="rgba(255,220,80,.9)";ctx.shadowBlur=14;
 const w=s.w,h=s.h;
 ctx.fillStyle="#78c850";ctx.strokeStyle="#214c22";ctx.lineWidth=3;
 ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,7);ctx.fill();ctx.stroke();
 ctx.fillStyle="#fff6b0";ctx.beginPath();ctx.arc(0,0,Math.min(w,h)*.27,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#387b35";ctx.font="bold "+Math.floor(h*.52)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("¥",0,1);
 ctx.restore();
}
function drawEnemy(e,t){const bob=Math.sin(t/150+e.phase)*2;ctx.save();ctx.translate(e.x,e.y+bob);ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=8;ctx.drawImage(enemyImg,-e.w/2,-e.h/2,e.w,e.h);ctx.restore();}
function collisionPit(p){
 const left=player.x+player.w*.22,right=player.x+player.w*.78;if(!(right>p.x&&left<p.x+p.w))return false;
 return player.y+player.h*.88>=terrainY(player.x+player.w*.5)-5;
}
function spawnEnemy(){
 const size=Math.min(78,Math.max(58,W*.15)),x=W+size;
 const ew=size,eh=size*(360/220);
 enemies.push({x:x,y:0,w:ew,h:eh,vx:speed*(.78+Math.random()*.2),phase:Math.random()*6.28});
}
function enemyHitsPlayer(e){
 const px=player.x+player.w*.5,py=player.y+player.h*.5;
 return Math.abs(e.x-px)<(e.w+player.w)*.36&&Math.abs(e.y-py)<(e.h+player.h)*.36;
}
function shotHitsEnemy(s,e){return Math.abs(s.x-e.x)<(s.w+e.w)*.42&&Math.abs(s.y-e.y)<(s.h+e.h)*.42;}
function gameOver(){
 if(state==="over")return;
 state="over";
 gameOverSound();
 startFace.style.display="block";
 panel.innerHTML=`<h1>ゲームオーバー！</h1><p>スコア：<b style="font-size:32px">${score}</b> 点</p><p>ロスカットスコア：<b style="font-size:28px">${lossCutScore}</b>万円</p><p>含み損で敵を倒せ！</p><button class="start" id="again">もう一度走る</button>`;
 center.style.display="flex";document.getElementById("again").onclick=()=>startGame();
}
function loop(now){
 if(state!=="playing")return;
 const dt=Math.min((now-last)/1000,.035);last=now;
 distance+=speed*dt;score+=Math.floor(speed*dt/75);scoreEl.textContent=score;
 speed=Math.min(W*.82,speed+dt*3.8);player.attackCd=Math.max(0,player.attackCd-dt);player.attackAnim=Math.max(0,player.attackAnim-dt);player.scatterBubble=Math.max(0,player.scatterBubble-dt);
 drawBackground(dt);
 for(const p of pits)p.x-=speed*dt;
 for(const it of items)it.x-=speed*dt;
 spawnX-=speed*dt;if(spawnX<0){addSet(W+100);spawnX=W*.72+Math.random()*W*.45;}
 enemyTimer-=dt;if(enemyTimer<=0){spawnEnemy();enemyTimer=1.4+Math.random()*2.4;}
 for(const e of enemies){e.x-=e.vx*dt;e.y=terrainY(e.x)-e.h*.82;}
 for(const s of shots){s.x+=s.vx*dt;s.life-=dt;}
 const wasFalling=player.vy>=0;
 if(player.flight>0){player.flight=Math.max(0,player.flight-dt);player.vy=0;player.y=Math.max(H*.15,Math.min(player.y,H*.56));}
 else {
   player.vy+=1900*dt;player.y+=player.vy*dt;
   if(wasFalling)for(const p of pits)if(collisionPit(p))return gameOver();
   const gy=terrainY(player.x+player.w*.5);
   if(player.y+player.h*.88>=gy){let over=false;const l=player.x+player.w*.22,r=player.x+player.w*.78;for(const p of pits)if(r>p.x&&l<p.x+p.w){over=true;break;}if(over)return gameOver();player.y=gy-player.h*.88;player.vy=0;player.onGround=true;player.jumps=0;}else player.onGround=false;
 }
 for(const it of items){it.y=it.type==="yarn"?terrainY(it.x)-58:terrainY(it.x)-105;const px=player.x+player.w*.5,py=player.y+player.h*.5;if(!it.got&&Math.hypot(it.x-px,it.y-py)<(it.w*.45+player.w*.28)){it.got=true;if(it.type==="wing"){wingItemSound();player.flight=3;player.vy=0;player.onGround=false;player.y=Math.min(player.y,H*.50);score+=25;}else{pointItemSound();score+=10;}scoreEl.textContent=score;}}
 for(const e of enemies)if(enemyHitsPlayer(e))return gameOver();
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];let hit=false;for(let j=enemies.length-1;j>=0;j--)if(shotHitsEnemy(s,enemies[j])){enemies.splice(j,1);score+=30;scoreEl.textContent=score;hit=true;break;}if(hit||s.life<=0||s.x>W+100)shots.splice(i,1);}
 pits=pits.filter(p=>p.x+p.w>-40);items=items.filter(it=>!it.got&&it.x>-70);enemies=enemies.filter(e=>e.x>-100);
 for(const p of pits)drawPit(p);for(const it of items)drawItem(it,now);for(const e of enemies)drawEnemy(e,now);for(const s of shots)drawShot(s);drawPlayer();
 if(player.flight>0){ctx.fillStyle="#fff";ctx.font="bold 16px sans-serif";ctx.textAlign="left";ctx.fillText("🪽 飛行中 "+player.flight.toFixed(1)+"秒",14,H-18);}
 requestAnimationFrame(loop);
}
resize();reset();startFace.style.display="block";
</script></div></body></html>
